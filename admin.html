<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Tidak Ditemukan</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" type="image/png" href="assets/images/logo-green.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #fdfbf7;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .error-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #003a31;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: 1.5rem;
      color: #111827;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .error-desc {
      font-size: 0.95rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-home {
      display: inline-block;
      background: #003a31;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: #00221c;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Halaman Tidak Ditemukan</h1>
    <p class="error-desc">Maaf, halaman yang Anda tuju (<code>/admin</code>) tidak tersedia, telah dihapus, atau Anda tidak memiliki izin akses.</p>
    <a href="index.html" class="btn-home">← Kembali ke Beranda Toko</a>
  </main>
</body>
</html>
